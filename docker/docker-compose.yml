name:  fil_rouge_immobilier

# Profils (chantier FLX, fiche FLX1 ; décision de Seb, Discord, 2026-10-15) :
#   - sans profil : db et api. « docker compose up -d » ne lance qu'eux ;
#   - profil airflow : minio, minio-setup et les trois services d'Airflow.
#     MinIO ne démarre donc plus seul : « docker compose --profile airflow up -d » ;
#   - profil elk (FLX7) : es-setup, elasticsearch et kibana ;
#   - tout : « docker compose --profile "*" up -d ».

# Réglages communs aux trois services d'Airflow, sur le modèle du lab du
# cours (md/flux/cours-airflow-synthese.md, dépôt Fil-Rouge) et du compose
# officiel de la 2.11.2 (airflow.apache.org/docs/apache-airflow/2.11.2/docker-compose.yaml,
# lu le 2026-10-15), en LocalExecutor : ni Redis ni Celery.
x-airflow-common: &airflow-common
  build: ../airflow
  image: fil_rouge_immobilier_airflow:2.11.2
  profiles: ["airflow"]
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Base « airflow » de notre PostgreSQL, rôle « airflow » (init-v3/07).
    # Le mot de passe entre tel quel dans l'URL : hexadécimal seulement
    # (voir .env.exemple).
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@db:5432/airflow
    # Chiffre les mots de passe des connexions Airflow ; valeur dans docker/.env.
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Petit serveur de santé du scheduler, port 8974 (son healthcheck).
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # FLX2 : « from src.config import ... » (DAG) et import « à plat » (lab).
    PYTHONPATH: /opt/airflow:/opt/airflow/src
    # Réglages lus par airflow/src/config.py (FLX2) ; mêmes noms que le
    # service api pour la base.
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Connexions Airflow des hooks (FLX2), au format JSON plutôt qu'en URI :
    # le mot de passe n'a pas à être encodé (pas de « " » ni de « \ »
    # dedans, voir .env.exemple). Format JSON : airflow.apache.org/docs/
    # apache-airflow/2.11.2/howto/connection.html, lu le 2026-10-15 ;
    # endpoint_url de MinIO dans les extras, comme le lab du cours.
    AIRFLOW_CONN_MINIO_DEFAULT: '{"conn_type": "aws", "login": "${MINIO_ROOT_USER}", "password": "${MINIO_ROOT_PASSWORD}", "extra": {"endpoint_url": "http://minio:9000"}}'
    AIRFLOW_CONN_FIL_ROUGE_DB: '{"conn_type": "postgres", "host": "db", "port": 5432, "schema": "${POSTGRES_DB}", "login": "${POSTGRES_USER}", "password": "${POSTGRES_PASSWORD}"}'
    # FLX8 : le DAG estates_index écrit dans Elasticsearch (profil elk) avec
    # le compte dédié airflow_indexer, créé par es-setup ; jamais elastic.
    AIRFLOW_CONN_ELASTICSEARCH_DEFAULT: '{"conn_type": "generic", "host": "http://elasticsearch:9200", "login": "airflow_indexer", "password": "${ES_INDEXER_PASSWORD:-}"}'
  volumes:
    - airflow_logs:/opt/airflow/logs
    # FLX2 : les DAG et le code métier, en lecture seule.
    - ../airflow/dags:/opt/airflow/dags:ro
    - ../airflow/src:/opt/airflow/src:ro
    # FLX4 : la copie du générateur d'annonces du sujet (question flux-17,
    # oui de Seb le 2026-10-15).
    - ../airflow/tools:/opt/airflow/tools:ro
  depends_on: &airflow-common-depends-on
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    container_name: fil_rouge_immobilier_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Rôle en lecture seule (LOT12, Q14) : lu par init-v3/04. Vide, le
      # rôle existe sans pouvoir se connecter.
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:-}
      # Rôle de la base airflow (FLX1) : lu par init-v3/07. Vide, le rôle
      # existe sans pouvoir se connecter.
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-v3:/docker-entrypoint-initdb.d
    healthcheck:
      # -h 127.0.0.1 : le serveur temporaire de l'init n'écoute pas le réseau ;
      # « healthy » n'arrive donc qu'après les scripts d'init-v3 (mesuré le
      # 2026-10-07 : 2 s sans -h, init non finie ; 6 s avec, init finie).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ../API
    container_name: fil_rouge_immobilier_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # L'URL est assemblee par src/app/conf/database.py a partir de ces
      # variables, qui sont deja celles du .env : le mot de passe n'est pas
      # recopie, et il est encode au passage (il peut contenir un @).
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Signature des jetons de connexion (ADR-052) ; valeur dans docker/.env.
      JWT_SECRET: ${JWT_SECRET}
      # Une cle par programme appelant (ADR-028, points 4 a 6) ; valeurs dans docker/.env.
      API_KEY_INTERNAL: ${API_KEY_INTERNAL}
      API_KEY_APP_BACKEND: ${API_KEY_APP_BACKEND}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}   # comptes de demo (seed_demo.py, chantier DEM) ; valeur dans docker/.env
      # GET /estates/search (FLX9) : compte en lecture seule api_search, créé
      # par es-setup (profil elk). Vide ou Elasticsearch arrêté : la route rend 503.
      ES_URL: http://elasticsearch:9200
      ES_API_USER: api_search
      ES_API_PASSWORD: ${ES_API_PASSWORD:-}
    ports:
      - "8000:8000"   # Swagger : http://localhost:8000/docs
    volumes:
      # Seuls src/ et tests/ sont montes, en lecture seule : --reload voit les
      # modifications, et le conteneur n'ecrit jamais dans le depot.
      # Surtout PAS ../API en entier : API/.env entrerait dans le conteneur
      # (le .dockerignore ne filtre que le build, pas un volume), et son
      # DATABASE_URL en "localhost" passerait devant POSTGRES_HOST=db.
      - ../API/src:/api/src:ro
      - ../API/tests:/api/tests:ro
      # Les fichiers SQL joues par le banc v2/v3 (chantier BAN), en lecture
      # seule. Jamais docker/ en entier : il porte .env.
      - ./init-v2:/api/sql/init-v2:ro
      - ./init-v3:/api/sql/init-v3:ro
      - ./migrations/v2-vers-v3:/api/sql/v2-vers-v3:ro

  minio:
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    container_name: fil_rouge_immobilier_minio
    profiles: ["airflow"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio_data:/data
  minio-setup:
    image: pgsty/mc@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    container_name: fil_rouge_immobilier_minio_setup
    profiles: ["airflow"]
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/bronze --ignore-existing;
      /usr/bin/mc mb myminio/silver --ignore-existing;
      /usr/bin/mc mb myminio/gold --ignore-existing;
      /usr/bin/mc mb myminio/quarantine --ignore-existing;
      echo 'buckets bronze/silver/gold/quarantine crees';
      "

  # Une fois : migre la base airflow, puis crée le compte admin de
  # l'interface. Variables _AIRFLOW_* lues par l'entrypoint de l'image
  # officielle (compose officiel de la 2.11.2).
  airflow-init:
    <<: *airflow-common
    container_name: fil_rouge_immobilier_airflow_init
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
  airflow-webserver:
    <<: *airflow-common
    container_name: fil_rouge_immobilier_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"   # Interface : http://localhost:8080 ; santé : /health
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
  airflow-scheduler:
    <<: *airflow-common
    container_name: fil_rouge_immobilier_airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Profil elk (FLX7) : repris du kit du TP1 du cours ELK
  # (TP-intro-elasticsearch-kibana/.../TP1 - Introduction/kit-TP/docker-compose.yml).
  # Environnement de LABORATOIRE : un nœud, sécurité active, TLS coupé comme le
  # TP ; ports sur 127.0.0.1 seulement. Les mots de passe sont lus dans le
  # conteneur ($$), jamais recopiés dans la configuration rendue.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.5.4}
    container_name: fil_rouge_immobilier_elasticsearch
    profiles: ["elk"]
    environment:
      - node.name=es01
      - cluster.name=fil-rouge
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ulimits:
      memlock: { soft: -1, hard: -1 }
    mem_limit: ${ES_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 60
  # Une fois : fixe le mot de passe de l'utilisateur interne kibana_system
  # (le « setup » du kit), puis crée le compte airflow_indexer du DAG
  # estates_index (FLX8), limité à l'index estates par le rôle
  # estates_writer ; enfin s'arrête. Rejouable : PUT remplace.
  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.5.4}
    container_name: fil_rouge_immobilier_es_setup
    profiles: ["elk"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    user: "0"
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD}
      ES_INDEXER_PASSWORD: ${ES_INDEXER_PASSWORD:-}
      ES_API_PASSWORD: ${ES_API_PASSWORD:-}
    # Forme liste : chaque élément est un argv (voir la note du kit sur le
    # scalaire replié « > »).
    command:
      - bash
      - -c
      - |
        echo "Définition du mot de passe kibana_system"
        until curl -s -X POST -u "elastic:$${ELASTIC_PASSWORD}" \
              -H "Content-Type: application/json" \
              http://elasticsearch:9200/_security/user/kibana_system/_password \
              -d "{\"password\":\"$${KIBANA_PASSWORD}\"}" | grep -q '^{}'
        do
          echo "Elasticsearch pas encore prêt, nouvelle tentative dans 5 s..."
          sleep 5
        done
        echo "OK"
        # account <rôle> <privilèges JSON> <compte> <mot de passe> : crée ou
        # remplace le rôle (index estates seul) et son compte. Mot de passe
        # vide : compte non créé, et Kibana démarre quand même.
        account() {
          if [ -z "$$4" ]; then
            echo "Mot de passe vide : compte $$3 non créé"
            return 0
          fi
          echo "Rôle $$1 et compte $$3"
          curl -sf -X PUT -u "elastic:$${ELASTIC_PASSWORD}" \
               -H "Content-Type: application/json" \
               http://elasticsearch:9200/_security/role/$$1 \
               -d "{\"indices\":[{\"names\":[\"estates\"],\"privileges\":$$2}]}" || exit 1
          echo
          curl -sf -X PUT -u "elastic:$${ELASTIC_PASSWORD}" \
               -H "Content-Type: application/json" \
               http://elasticsearch:9200/_security/user/$$3 \
               -d "{\"password\":\"$$4\",\"roles\":[\"$$1\"]}" || exit 1
          echo
        }
        # FLX8 : le DAG estates_index écrit l'index.
        account estates_writer '["create_index","view_index_metadata","read","write","maintenance"]' \
                airflow_indexer "$${ES_INDEXER_PASSWORD}"
        # FLX9 : l'API le lit seulement (GET /estates/search).
        account estates_reader '["read"]' api_search "$${ES_API_PASSWORD}"
    restart: "no"
  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-9.5.4}
    container_name: fil_rouge_immobilier_kibana
    profiles: ["elk"]
    depends_on:
      es-setup:
        condition: service_completed_successfully
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
    ports:
      - "127.0.0.1:5601:5601"   # http://localhost:5601, compte elastic
    volumes:
      - kibana_data:/usr/share/kibana/data
    mem_limit: ${KB_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'"]
      interval: 10s
      timeout: 10s
      retries: 60

volumes:
  db_data:
  minio_data:
  airflow_logs:
  es_data:
  kibana_data:
