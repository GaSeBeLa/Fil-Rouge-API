name: 
  fil_rouge_immobilier
services: 
  db:
    image: postgres:16
    container_name: fil_rouge_immobilier_db
    environment:
      POSTGRES_DB: fil_rouge_immobilier
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
  minio:
    image: minio/minio:latest
    container_name: fil_rouge_immobilier_minio
    environment:
      MINIO_ROOT_USER: minioadmin # TO DO créer variables dans .env pour sécurité
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio_data:/data
  minio-setup:
    image: minio/mc
    container_name: fil_rouge_immobilier_minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/bronze --ignore-existing;
      /usr/bin/mc mb myminio/silver --ignore-existing;
      /usr/bin/mc mb myminio/gold --ignore-existing;
      echo 'buckets bronze/silver/gold crees';
      "

volumes:
  db_data:
  minio_data:
