# Logs d'accès de l'API -> data stream logs-api-default (FLX10).
# Modèle : pipeline "web" du kit du TP2 du cours ELK.
#
# L'API écrit déjà une ligne JSON par requête, aux noms ECS
# (API/src/app/conf/logging.py) : http.request.method, url.path,
# http.response.status_code, event.duration (ns), user.roles. Le codec json
# les reprend tels quels, @timestamp compris ; pas de grok.
input {
  file {
    path => "/data/api/access.json"
    mode => "tail"
    start_position => "beginning"
    # Retenu dans le volume de Logstash : un redémarrage ne relit pas tout.
    sincedb_path => "/usr/share/logstash/data/sincedb_api"
    codec => "json"
  }
}

filter {
  # Le texte brut et l'emplacement du fichier n'apportent rien à l'analyse.
  mutate { remove_field => ["[event][original]", "[log]", "[host]"] }
}

output {
  elasticsearch {
    hosts => ["${ES_HOSTS}"]
    user => "${ES_USER}"
    password => "${ES_PASSWORD}"
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_dataset => "api"
    data_stream_namespace => "default"
  }
}
